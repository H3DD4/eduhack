name: CI
on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_DB: thinkfirst, POSTGRES_USER: thinkfirst, POSTGRES_PASSWORD: thinkfirst_dev }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U thinkfirst" --health-interval 3s --health-retries 20
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv -e ".[dev]"
      - run: .venv/bin/ruff check .
      - run: .venv/bin/mypy thinkfirst --ignore-missing-imports || true  # advisory until types are tightened
      - run: .venv/bin/python -m pytest -p no:logging
      - name: Postgres migration, seed and RLS tests
        env:
          PGPASSWORD: thinkfirst_dev
        run: |
          psql -h localhost -U thinkfirst -d thinkfirst -f ../infra/postgres/init.sql
          MIGRATION_DATABASE_URL=postgresql+psycopg://thinkfirst:thinkfirst_dev@localhost:5432/thinkfirst .venv/bin/python -m alembic upgrade head
          DATABASE_URL=postgresql+psycopg://thinkfirst_app:thinkfirst_app_dev@localhost:5432/thinkfirst LLM_PROVIDER=demo .venv/bin/python -m thinkfirst.seed --with-subject
          TEST_PG_APP_URL=postgresql+psycopg://thinkfirst_app:thinkfirst_app_dev@localhost:5432/thinkfirst .venv/bin/python -m pytest -p no:logging tests/test_postgres_rls.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm run lint && npm test
        working-directory: web
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv -e .
        working-directory: api
      - run: npx playwright install --with-deps chromium && npm run e2e
        working-directory: web
