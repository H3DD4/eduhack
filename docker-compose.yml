# ThinkFirst local stack:  docker compose up --build   ->  http://localhost:3000
# Demo account: demo@thinkfirst.local / demo-password (labeled Demo data)
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: thinkfirst
      POSTGRES_USER: thinkfirst
      POSTGRES_PASSWORD: thinkfirst_dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thinkfirst -d thinkfirst"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # S3-compatible object storage (SeaweedFS S3 gateway; MinIO images are no longer publicly pullable — DECISIONS D-026)
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -s3.port=8333 -dir=/data -ip.bind=0.0.0.0
    ports: ["8333:8333"]
    volumes: [s3data:/data]

  # Vector DB for RAG (course chunks + shared open library). Own volume; other projects' Qdrant untouched.
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrantdata:/qdrant/storage]

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    env_file:
      - path: api/.env
        required: false
    environment: &apienv
      # migrations run as the owner; the app runs as the non-superuser RLS role
      MIGRATION_DATABASE_URL: postgresql+psycopg://thinkfirst:thinkfirst_dev@postgres:5432/thinkfirst
      DATABASE_URL: postgresql+psycopg://thinkfirst_app:thinkfirst_app_dev@postgres:5432/thinkfirst
      REDIS_URL: redis://redis:6379/0
      JOB_MODE: arq
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://s3:8333
      S3_ACCESS_KEY: thinkfirst
      S3_SECRET_KEY: thinkfirst_dev_secret  # dev only; SeaweedFS runs without identities locally
      APP_BASE_URL: http://localhost:3000
      DEMO_MODE: "true"
      QDRANT_URL: http://qdrant:6333
    command: >
      sh -c "python -m alembic upgrade head && python -m thinkfirst.seed &&
             uvicorn thinkfirst.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      s3: { condition: service_started }
      qdrant: { condition: service_started }

  worker:
    build: { context: ., dockerfile: api/Dockerfile }
    env_file:
      - path: api/.env
        required: false
    environment: *apienv
    working_dir: /app
    command: python -m arq worker.worker.WorkerSettings
    depends_on: [api]

  web:
    build: { context: ./web, args: { API_URL: "http://api:8000" } }
    environment:
      API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  s3data:
  qdrantdata:
